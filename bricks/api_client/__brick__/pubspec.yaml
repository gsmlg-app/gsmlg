name: "{{package_name.snakeCase()}}"
version: 1.0.0
description: API client, generate from OpenAPI spec

environment:
  sdk: ">=3.8.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  retrofit: ^4.10.0

dev_dependencies:
  test: "^1.31.1"
  build_runner: any
  json_serializable: "^6.15.2"
  freezed: ^4.0.1 # for freezed
  swagger_parser: "^1.45.0"
  retrofit_generator: ^10.3.2

global_options:
  freezed:
    runs_before:
      - json_serializable
  json_serializable:
    runs_before:
      - retrofit_generator
