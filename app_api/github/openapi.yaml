        - workflows

    WorkflowRun:
      type: object
      description: A GitHub Actions workflow run
      properties:
        id:
          type: integer
          description: The ID of the workflow run
        name:
          type: string
          nullable: true
          description: The name of the workflow run
        node_id:
          type: string
        check_suite_id:
          type: integer
          nullable: true
        check_suite_node_id:
          type: string
          nullable: true
        head_branch:
          type: string
          nullable: true
          description: The branch of the head commit
        head_sha:
          type: string
          description: The SHA of the head commit
        path:
          type: string
        display_title:
          type: string
          description: Title of the workflow run
        run_number:
          type: integer
          description: The auto incrementing run number for the workflow run
        run_attempt:
          type: integer
        referenced_workflows:
          type: array
          items:
            $ref: '#/components/schemas/ReferencedWorkflow'
          nullable: true
        event:
          type: string
          description: The event that triggered the workflow run
        status:
          type: string
          nullable: true
          description: The status of the workflow run
          enum:
            - requested
            - in_progress
            - completed
            - queued
            - waiting
            - pending
        conclusion:
          type: string
          nullable: true
          description: The conclusion of the workflow run
          enum:
            - success
            - failure
            - neutral
            - cancelled
            - skipped
            - timed_out
            - action_required
            - stale
            - startup_failure
        workflow_id:
          type: integer
          description: The ID of the parent workflow
        url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
        pull_requests:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PullRequestMinimal'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        actor:
