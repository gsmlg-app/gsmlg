        run_started_at:
          type: string
          format: date-time
        jobs_url:
          type: string
          format: uri
        logs_url:
          type: string
          format: uri
        check_suite_url:
          type: string
          format: uri
        artifacts_url:
          type: string
          format: uri
        cancel_url:
          type: string
          format: uri
        rerun_url:
          type: string
          format: uri
        previous_attempt_url:
          type: string
          format: uri
          nullable: true
        workflow_url:
          type: string
          format: uri
