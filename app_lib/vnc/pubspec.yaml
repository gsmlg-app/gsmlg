name: app_vnc
description: Pure-Dart RFB/VNC client with macOS ARD authentication, ZRLE decoding, SSH tunnel transport, and mDNS discovery.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"
resolution: workspace

dependencies:
  app_logging: any
  app_ssh: any
  crypto: any
  equatable: ^3.0.0
  meta: ^1.19.0
  multicast_dns: any
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
