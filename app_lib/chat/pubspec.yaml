name: app_chat
description: Core chat library with models and repositories for on-device LLM chat
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  lib_llama_cpp: ^0.5.2
  lib_llama_cpp_platform_interface: ^0.5.2
  equatable: ^2.0.8
  drift: ^2.28.2
  dio: any
  html: any
  http: any
  path_provider: ^2.1.5
  path: any
  app_database: any
  app_secure_storage: any
  cloudflare_dns: any
  gsmlg_whois: any
  ip_db: any
  route53: any
  vultr_api: any
  dart_mcp: ^0.5.1
  stream_channel: ^2.1.4

dev_dependencies:
  test: ^1.30.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  flutter_lints: ^6.0.0
