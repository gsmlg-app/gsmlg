name: app_database
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.26.2
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.6.0+eol

# Configure sqlite3 to use local asset
sqlite3:
  macos:
    dylib:
      - assets/sqlite3/libsqlite3.arm64.macos.dylib

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.2
  build_runner: ^2.4.15

flutter:
  assets:
    - assets/sqlite3/
