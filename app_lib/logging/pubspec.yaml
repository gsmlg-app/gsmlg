name: app_logging
description: Centralized logging and error handling for the Flutter app template
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  logging: ^1.3.0
  stack_trace: ^1.12.2
  shared_preferences: ^2.5.6
  meta: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
