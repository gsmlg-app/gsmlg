name: app_ssh
publish_to: "none"
version: 1.0.0+1
description: SSH and SFTP client written in pure Dart, aiming to be feature-rich as well as easy to use.

environment:
  sdk: ">=3.6.0 <4.0.0"
resolution: workspace

dependencies:
  asn1lib: ^1.6.5
  convert: ^3.1.2
  meta: ^1.19.0
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0

dev_dependencies:
  build_runner: ^2.16.1
  dart_code_metrics_presets: ^2.33.0
  lints: ^6.1.0
  test: ^1.31.1

false_secrets:
  - test
