name: ios_shell
description: Self-contained shell environment for iOS using ios_system framework (a-shell)
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IosShellPlugin

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
