name: android_shell
description: Self-contained shell environment for Android using bundled busybox binaries
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

flutter:
  plugin:
    platforms:
      android:
        package: app.gsmlg.android_shell
        pluginClass: AndroidShellPlugin

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
