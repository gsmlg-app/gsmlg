name: flutter_pty
description: Pty for Flutter. Provides the ability to create processes with pseudo terminal file descriptors.
version: 0.4.2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ^3.24.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  ffigen: ^23.0.0

  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
