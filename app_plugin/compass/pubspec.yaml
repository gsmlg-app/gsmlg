name: app_compass
description: Magnetic compass readings for Android and iOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.app.compass
        pluginClass: CompassPlugin
      ios:
        pluginClass: CompassPlugin
