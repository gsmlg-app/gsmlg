name: app_local_llm_ios
description: iOS implementation of app_local_llm using lib_mlx
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

flutter:
  plugin:
    implements: app_local_llm
    platforms:
      ios:
        pluginClass: LocalLlmIosPlugin

dependencies:
  flutter:
    sdk: flutter
  app_local_llm_platform_interface: any
  lib_mlx: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
