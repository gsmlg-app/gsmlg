name: terminal_tabs
description: Tab UI components for the terminal application
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  flex_tabs: any
  xterm: ^4.0.0
  code_text_field: ^1.1.0
  highlight: ^0.7.0
  context_menus: ^2.0.0+1
  window_manager: ^0.5.2
  app_database: any
  app_secure_storage: any
  app_locale: any
  duskmoon_ui: ^2.2.5
  terminal_core: any
  terminal_hosts: any
  terminal_plugin: any
  shell_profile_bloc: any
  ssh_host_bloc: any
  ssh_key_bloc: any
  terminal_tab_bloc: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
