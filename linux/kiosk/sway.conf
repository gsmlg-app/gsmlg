xwayland disable
output HDMI-A-1 mode 1920x1080@60Hz
output * bg #11131a solid_color
default_border none
seat * hide_cursor 5000

for_window [app_id="org.gsmlg.app" title="^GSMLG$"] fullscreen enable
exec /usr/local/bin/gsmlg-kiosk-start-app

bindsym Mod4+Shift+r exec systemctl --user restart gsmlg-kiosk-app.service
