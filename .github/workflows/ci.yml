name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.specify/**'
      - '.speckit/**'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'LICENSE'
      - '.vscode/**'
      - '.idea/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.specify/**'
      - '.speckit/**'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'LICENSE'
      - '.vscode/**'
      - '.idea/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: flutter-actions/setup-flutter@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare bundled title model
        run: python3 tools/conversation_title/prepare.py --download

      - name: Prepare project
        run: melos run prepare

      - name: Check formatting
        run: melos run format-check

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: flutter-actions/setup-flutter@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare bundled title model
        run: python3 tools/conversation_title/prepare.py --download

      - name: Prepare project
        run: melos run prepare

      - name: Run analyze
        run: melos run analyze

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: flutter-actions/setup-flutter@v4

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare bundled title model
        run: python3 tools/conversation_title/prepare.py --download

      - name: Prepare project
        run: melos run prepare

      - name: Run tests
        run: melos run test

  activity-monitor-native:
    name: Activity Monitor Native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            engine_arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            engine_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install native development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libepoxy-dev libfontconfig-dev pkg-config

      - name: Download Flutter Linux engine
        shell: python
        env:
          ACTIVITY_ENGINE_ARCH: ${{ matrix.engine_arch }}
        run: |
          import json
          import os
          import pathlib
          import re
          import shutil
          import urllib.request
          import zipfile

          # These native tests need the matching headers and shared library only.
          base = "https://storage.googleapis.com/flutter_infra_release"
          with urllib.request.urlopen(f"{base}/releases/releases_linux.json", timeout=30) as response:
              framework = json.load(response)["current_release"]["stable"]
          with urllib.request.urlopen(
              f"https://raw.githubusercontent.com/flutter/flutter/{framework}/bin/internal/engine.version",
              timeout=30,
          ) as response:
              engine = response.read().decode().strip()
          assert re.fullmatch(r"[0-9a-f]{40}", engine)
          arch = os.environ["ACTIVITY_ENGINE_ARCH"]
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "activity-flutter-engine"
          destination.mkdir()
          archive = destination / "engine.zip"
          url = f"{base}/flutter/{engine}/linux-{arch}-debug/linux-{arch}-flutter-gtk.zip"
          with urllib.request.urlopen(url, timeout=30) as response, archive.open("wb") as output:
              shutil.copyfileobj(response, output)
          with zipfile.ZipFile(archive) as bundle:
              for entry in bundle.infolist():
                  assert (destination / entry.filename).resolve().is_relative_to(destination.resolve())
              bundle.extractall(destination)
          print(f"Flutter stable engine {engine} ({arch})")

      - name: Test Linux activity collector
        run: bash app_plugin/system_metrics/system_metrics_linux/test/linux_activity_smoke_test.sh

      - name: Test Linux activity method channel
        run: |
          bash app_plugin/system_metrics/system_metrics_linux/test/linux_activity_channel_test.sh \
            "$RUNNER_TEMP/activity-flutter-engine"

  build:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: flutter-actions/setup-flutter@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install tools
        run: dart pub global activate melos

      - name: Prepare bundled title model
        run: python3 tools/conversation_title/prepare.py --download

      - name: Prepare project
        run: melos run prepare

      - name: Qualify Linux title runtime independently of application plugins
        working-directory: app_lib/chat
        run: |
          export TITLE_MODEL_PATH="$PWD/../../assets/models/conversation_title/MiniCPM5-1B-Q4_K_M.gguf"
          export TITLE_LIBRARY_PATH="$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*/lib_llama_cpp_linux-0.7.5/linux/prebuilt/x64/liblib_llama_cpp_linux.so' -print -quit)"
          test -f "$TITLE_LIBRARY_PATH"
          flutter test --no-pub test/minicpm_title_native_smoke_test.dart

      - name: Build Linux
        run: flutter build linux --release

      - name: Verify packaged offline title model and native inference
        run: |
          python3 tools/conversation_title/verify_package.py build/linux/x64/release/bundle
          TITLE_MODEL_PATH="$PWD/build/linux/x64/release/bundle/data/flutter_assets/assets/models/conversation_title/MiniCPM5-1B-Q4_K_M.gguf" \
          TITLE_LIBRARY_PATH="$PWD/build/linux/x64/release/bundle/lib/liblib_llama_cpp_linux.so" \
          flutter test --no-pub app_lib/chat/test/minicpm_title_native_smoke_test.dart

  title-windows:
    name: Qualify Windows offline titles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: flutter-actions/setup-flutter@v4
      - name: Install tools
        run: dart pub global activate melos
      - name: Prepare bundled title model
        run: python tools/conversation_title/prepare.py --download
      - name: Prepare project
        run: melos run prepare
      - name: Qualify Windows title runtime independently of application plugins
        working-directory: app_lib/chat
        run: |
          $cache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA/Pub/Cache" }
          $env:TITLE_MODEL_PATH = "$pwd/../../assets/models/conversation_title/MiniCPM5-1B-Q4_K_M.gguf"
          $env:TITLE_LIBRARY_PATH = "$cache/hosted/pub.dev/lib_llama_cpp_windows-0.7.5/windows/prebuilt/x64/lib_llama_cpp_windows.dll"
          if (!(Test-Path $env:TITLE_LIBRARY_PATH)) { throw "Bundled native title library missing" }
          flutter test --no-pub test/minicpm_title_native_smoke_test.dart
      - name: Build Windows
        run: flutter build windows --release
      - name: Verify packaged offline title model and native inference
        run: |
          python tools/conversation_title/verify_package.py build/windows/x64/runner/Release
          $env:TITLE_MODEL_PATH = "$pwd/build/windows/x64/runner/Release/data/flutter_assets/assets/models/conversation_title/MiniCPM5-1B-Q4_K_M.gguf"
          $env:TITLE_LIBRARY_PATH = "$pwd/build/windows/x64/runner/Release/lib_llama_cpp_windows.dll"
          flutter test --no-pub app_lib/chat/test/minicpm_title_native_smoke_test.dart
