name: Release Monitor Agent

on:
  push:
    tags:
      - 'monitor-agent-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            artifact: gsmlg-monitor-agent-linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: gsmlg-monitor-agent-linux-arm64
          - os: macos-latest
            arch: arm64
            artifact: gsmlg-monitor-agent-macos-arm64
          - os: macos-13
            arch: x64
            artifact: gsmlg-monitor-agent-macos-x64
          - os: windows-latest
            arch: x64
            artifact: gsmlg-monitor-agent-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        working-directory: monitor_agent
        run: dart pub get

      - name: Compile binary
        working-directory: monitor_agent
        run: dart compile exe bin/monitor_agent.dart -o ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: monitor_agent/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
